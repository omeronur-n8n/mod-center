name: gelisio
description: Girişimci için alışkanlık, proje ve hobi gelişim takibi.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: GelisioIcons
      fonts:
        - asset: assets/fonts/GelisioIcons.ttf
